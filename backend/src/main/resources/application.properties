
server.port=${PORT:8080}

# Aiven MySQL database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://tourister-mysql-tourister-java-full-stack.b.aivencloud.com:18315/wordchain?sslMode=REQUIRED}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avnadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA settings
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Disable H2 console
spring.h2.console.enabled=false

server.error.include-message=always
